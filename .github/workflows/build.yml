# 推送后自动：生成网页 → 收进新出现的字 → 存回仓库 → 发布到 GitHub Pages
# 所以在手机上只改 copy/*.md 也能直接上线。
name: 生成并发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # 把生成的网页、字体存回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet fonttools brotli

      # 原始字体（Google Fonts 官方仓库，SIL OFL），放在网站文件夹外面，缓存起来
      - name: 原始字体
        id: fontsrc
        uses: actions/cache@v4
        with:
          path: ~/_fonts-src
          key: noto-sc-vf-v1
      - if: steps.fontsrc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/_fonts-src
          curl -fsSL -o ~/_fonts-src/NotoSerifSC-VF.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
          curl -fsSL -o ~/_fonts-src/NotoSansSC-VF.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"

      - name: 生成网页
        run: node tools/build-series.mjs
      - name: 字体：收进新出现的字
        run: python tools/fonts.py ~/_fonts-src && node tools/build-series.mjs > /dev/null

      # 生成的结果存回仓库，电脑和手机下次取回时就是最新的（推送由机器人完成，不会再触发这一流程）
      - name: 存回仓库
        run: |
          rm -f proof.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "没有需要存回的改动"; else
            git commit -q -m "自动生成：网页与字体"
            git push || echo "::warning::存回仓库失败（期间可能又有推送），网站照常发布"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
